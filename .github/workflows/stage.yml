name: Stage the app

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AZURE_WEBAPP_NAME: irvv17-deployment-nodeapp-azure
  AZURE_RESOURCE_GROUP: cd-with-actions-nodeapp
  IMAGE_NAME: ghcr.io/${{ github.repository }}/deployment-nodeapp-azure

jobs:
  build-and-deploy:
    name: Build and deploy staged container
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'stage') && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and build application
        run: |
          npm ci
          npm run build

      - name: Validate Azure OIDC configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "::error::Missing AZURE_CLIENT_ID secret"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "::error::Missing AZURE_TENANT_ID secret"; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "::error::Missing AZURE_SUBSCRIPTION_ID secret"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.event.pull_request.head.sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service container
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --docker-custom-image-name "$IMAGE_NAME:${{ github.event.pull_request.head.sha }}" \
            --docker-registry-server-url https://ghcr.io \
            --docker-registry-server-user "${GITHUB_REPOSITORY_OWNER}" \
            --docker-registry-server-password "$GHCR_READ_TOKEN"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings WEBSITES_PORT=8000 NODE_ENV=production

      - name: Deploy image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}:${{ github.event.pull_request.head.sha }}
